<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Types of CSS</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Internal CSS -->
    <style>
        h2 {
            color: blue;
            text-align: center;
        }

        .internal {
            background-color: lightyellow;
            padding: 15px;
            border: 2px solid orange;
        }
    </style>
</head>

<body>

    <h1>Inline, Internal and External CSS</h1>

    <!-- Inline CSS -->
    <p style="color: red; font-size: 20px;">
        This paragraph uses Inline CSS.
    </p>

    <!-- Internal CSS -->
    <h2>Internal CSS Example</h2>

    <p class="internal">
        This paragraph is styled using Internal CSS.
    </p>

    <!-- External CSS -->
    <div class="external">
        <h3>External CSS Example</h3>
        <p>
            This section is styled using an external CSS file.
        </p>
    </div>

</body>
</html>
