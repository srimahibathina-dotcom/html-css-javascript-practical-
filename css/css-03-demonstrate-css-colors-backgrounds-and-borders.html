<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Colors, Backgrounds and Borders</title>

    <style>
        /* Page background */
        body {
            background-color: #f0f8ff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
        }

        /* Text colors */
        h1 {
            color: blue;
        }

        .color-box {
            color: white;
            background-color: green;
            padding: 20px;
            margin: 20px;
            border: 3px solid darkgreen;
        }

        /* Background example */
        .background-box {
            background-color: lightyellow;
            background-image: linear-gradient(to right, lightblue, lightgreen);
            padding: 30px;
            margin: 20px;
            border: 4px solid orange;
        }

        /* Border examples */
        .border-box {
            background-color: white;
            padding: 25px;
            margin: 20px;
            border: 5px dashed red;
        }

        .rounded-box {
            background-color: #e6e6fa;
            padding: 25px;
            margin: 20px;
            border: 3px solid purple;
            border-radius: 15px;
        }
    </style>
</head>

<body>

    <h1>CSS Colors, Backgrounds and Borders</h1>

    <div class="color-box">
        <h2>Colors</h2>
        <p>This box demonstrates text and background colors.</p>
    </div>

    <div class="background-box">
        <h2>Backgrounds</h2>
        <p>This box demonstrates background color and gradient.</p>
    </div>

    <div class="border-box">
        <h2>Borders</h2>
        <p>This box has a dashed red border.</p>
    </div>

    <div class="rounded-box">
        <h2>Rounded Border</h2>
        <p>This box demonstrates a rounded purple border.</p>
    </div>

</body>
</html>
