<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Flexbox</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        /* Flex Container */
        .flex-container {
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;

            background-color: #ddd;
            padding: 30px;
            min-height: 300px;
        }

        /* Flex Items */
        .box {
            width: 180px;
            height: 150px;
            background-color: #0077b6;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            font-size: 20px;
        }

        .box:nth-child(2) {
            background-color: #0096c7;
        }

        .box:nth-child(3) {
            background-color: #00b4d8;
        }

        .box:nth-child(4) {
            background-color: #48cae4;
        }

        /* Responsive Flexbox */
        @media (max-width: 600px) {
            .flex-container {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <h1>CSS Flexbox Demonstration</h1>

    <div class="flex-container">

        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>
        <div class="box">Box 4</div>

    </div>

</body>
</html>
