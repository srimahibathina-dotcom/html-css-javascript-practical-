<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navigation Menu</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        /* Navigation Bar */
        nav {
            background-color: #222;
            padding: 15px;
        }

        /* Navigation Links */
        .menu {
            display: flex;
            justify-content: center;
            list-style: none;
        }

        .menu li {
            margin: 0 10px;
        }

        .menu a {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            display: block;
            border-radius: 5px;
        }

        /* Hover Effect */
        .menu a:hover {
            background-color: #0077b6;
        }

        /* Page Content */
        .content {
            text-align: center;
            padding: 50px;
        }

        .content h1 {
            color: #333;
            margin-bottom: 15px;
        }

        /* Mobile Responsive Design */
        @media screen and (max-width: 600px) {

            .menu {
                flex-direction: column;
                align-items: center;
            }

            .menu li {
                width: 100%;
                margin: 5px 0;
                text-align: center;
            }

            .menu a {
                background-color: #333;
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation Menu -->
    <nav>
        <ul class="menu">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Projects</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <!-- Page Content -->
    <div class="content">
        <h1>Responsive Navigation Menu</h1>
        <p>
            Resize the browser window to see the responsive effect.
        </p>
    </div>

</body>
</html>
