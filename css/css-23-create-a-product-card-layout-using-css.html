<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        /* Container */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 50px;
        }

        /* Product Card */
        .product-card {
            width: 280px;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        /* Card Hover Effect */
        .product-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        }

        /* Product Image */
        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        /* Product Details */
        .product-info {
            padding: 20px;
            text-align: center;
        }

        .product-info h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .product-info p {
            color: #666;
            margin-bottom: 15px;
        }

        /* Price */
        .price {
            color: #e63946;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* Button */
        .btn {
            display: inline-block;
            background-color: #0077b6;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
        }

        .btn:hover {
            background-color: #023e8a;
        }

        /* Responsive Design */
        @media screen and (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .product-card {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Product Card 1 -->
        <div class="product-card">

            <img src="https://via.placeholder.com/280x200"
                 alt="Product Image">

            <div class="product-info">
                <h2>Smart Watch</h2>

                <p>
                    Stylish smartwatch with fitness and health features.
                </p>

                <div class="price">₹2,999</div>

                <a href="#" class="btn">Buy Now</a>
            </div>

        </div>

        <!-- Product Card 2 -->
        <div class="product-card">

            <img src="https://via.placeholder.com/280x200"
                 alt="Product Image">

            <div class="product-info">
                <h2>Headphones</h2>

                <p>
                    Comfortable wireless headphones with clear sound.
                </p>

                <div class="price">₹1,999</div>

                <a href="#" class="btn">Buy Now</a>
            </div>

        </div>

        <!-- Product Card 3 -->
        <div class="product-card">

            <img src="https://via.placeholder.com/280x200"
                 alt="Product Image">

            <div class="product-info">
                <h2>Backpack</h2>

                <p>
                    Durable backpack suitable for college and travel.
                </p>

                <div class="price">₹899</div>

                <a href="#" class="btn">Buy Now</a>
            </div>

        </div>

    </div>

</body>
</html>
