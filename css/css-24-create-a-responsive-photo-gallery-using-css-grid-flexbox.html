<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Photo Gallery</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        /* CSS Grid Gallery */
        .gallery {
            display: grid;

            /* Responsive columns */
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));

            gap: 20px;
            max-width: 1100px;
            margin: auto;
        }

        /* Gallery Images */
        .gallery img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
            border: 3px solid white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);

            transition: transform 0.3s;
        }

        /* Hover Effect */
        .gallery img:hover {
            transform: scale(1.05);
        }

        /* Mobile */
        @media screen and (max-width: 500px) {
            body {
                padding: 15px;
            }

            .gallery {
                grid-template-columns: 1fr;
            }

            .gallery img {
                height: 250px;
            }
        }
    </style>
</head>

<body>

    <h1>My Photo Gallery</h1>

    <div class="gallery">

        <img src="https://picsum.photos/id/1015/500/400"
             alt="Mountain">

        <img src="https://picsum.photos/id/1016/500/400"
             alt="Nature">

        <img src="https://picsum.photos/id/1025/500/400"
             alt="Dog">

        <img src="https://picsum.photos/id/1035/500/400"
             alt="Landscape">

        <img src="https://picsum.photos/id/1043/500/400"
             alt="Forest">

        <img src="https://picsum.photos/id/1069/500/400"
             alt="Beach">

        <img src="https://picsum.photos/id/1074/500/400"
             alt="River">

        <img src="https://picsum.photos/id/1084/500/400"
             alt="Waterfall">

    </div>

</body>
</html>
