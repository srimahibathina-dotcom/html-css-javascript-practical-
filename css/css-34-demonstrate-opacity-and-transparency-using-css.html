<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Opacity and Transparency</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .box {
            width: 200px;
            height: 150px;
            padding: 20px;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
        }

        /* Normal element - no transparency */
        .normal {
            background-color: blue;
            opacity: 1;
        }

        /* 50% opacity */
        .half-opacity {
            background-color: blue;
            opacity: 0.5;
        }

        /* 20% opacity */
        .low-opacity {
            background-color: blue;
            opacity: 0.2;
        }

        /* Transparent background using RGBA */
        .transparent-bg {
            background-color: rgba(255, 0, 0, 0.5);
            color: black;
        }

        /* Transparent background using HSLA */
        .hsla-bg {
            background-color: hsla(120, 100%, 40%, 0.5);
            color: white;
        }

        /* Background image to show transparency */
        .image-box {
            width: 400px;
            height: 200px;
            margin: 40px auto;
            background-image: url("https://picsum.photos/id/1015/600/400");
            background-size: cover;
            background-position: center;
            padding: 50px;
        }

        .overlay {
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 30px;
            border-radius: 10px;
        }

        @media screen and (max-width: 600px) {
            .image-box {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <h1>CSS Opacity and Transparency</h1>

    <div class="container">

        <div class="box normal">
            100% Opacity
        </div>

        <div class="box half-opacity">
            50% Opacity
        </div>

        <div class="box low-opacity">
            20% Opacity
        </div>

        <div class="box transparent-bg">
            RGBA 50%
        </div>

        <div class="box hsla-bg">
            HSLA 50%
        </div>

    </div>

    <!-- Transparent Overlay -->
    <div class="image-box">
        <div class="overlay">
            <h2>Transparent Overlay</h2>
            <p>
                This box uses rgba() to create a transparent background.
            </p>
        </div>
    </div>

</body>
</html>
