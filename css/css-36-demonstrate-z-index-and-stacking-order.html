<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-Index and Stacking Order</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        .container {
            position: relative;
            width: 500px;
            height: 350px;
            margin: 40px auto;
            background-color: white;
            border: 3px solid #333;
        }

        /* Box 1 */
        .box1 {
            position: absolute;
            width: 180px;
            height: 180px;
            background-color: red;
            top: 40px;
            left: 60px;

            z-index: 1;
        }

        /* Box 2 */
        .box2 {
            position: absolute;
            width: 180px;
            height: 180px;
            background-color: blue;
            top: 90px;
            left: 150px;

            z-index: 2;
        }

        /* Box 3 */
        .box3 {
            position: absolute;
            width: 180px;
            height: 180px;
            background-color: green;
            top: 140px;
            left: 240px;

            z-index: 3;
        }

        .box {
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
        }

        .info {
            max-width: 600px;
            margin: auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <h1>CSS Z-Index and Stacking Order</h1>

    <div class="container">

        <!-- Lower z-index -->
        <div class="box box1">
            Red<br>Z-Index: 1
        </div>

        <!-- Middle z-index -->
        <div class="box box2">
            Blue<br>Z-Index: 2
        </div>

        <!-- Higher z-index -->
        <div class="box box3">
            Green<br>Z-Index: 3
        </div>

    </div>

    <div class="info">
        <h2>How z-index Works</h2>

        <p>
            Elements with a higher z-index appear in front of elements
            with a lower z-index when they overlap.
        </p>

        <p>
            In this example, the green box has the highest z-index,
            so it appears above the blue and red boxes.
        </p>
    </div>

</body>
</html>
