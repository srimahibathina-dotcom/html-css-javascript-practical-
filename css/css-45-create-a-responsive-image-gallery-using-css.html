<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Gallery</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        /* Responsive Gallery */
        .gallery {
            max-width: 1000px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .gallery img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
            transition: 0.3s;
        }

        /* Hover Effect */
        .gallery img:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        /* Tablet */
        @media screen and (max-width: 800px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Mobile */
        @media screen and (max-width: 500px) {
            body {
                padding: 15px;
            }

            .gallery {
                grid-template-columns: 1fr;
            }

            .gallery img {
                height: 250px;
            }
        }
    </style>
</head>

<body>

    <h1>Responsive Image Gallery</h1>

    <div class="gallery">

        <img src="https://picsum.photos/id/1015/600/400"
             alt="Mountain">

        <img src="https://picsum.photos/id/1016/600/400"
             alt="Nature">

        <img src="https://picsum.photos/id/1025/600/400"
             alt="Dog">

        <img src="https://picsum.photos/id/1035/600/400"
             alt="Landscape">

        <img src="https://picsum.photos/id/1043/600/400"
             alt="Forest">

        <img src="https://picsum.photos/id/1069/600/400"
             alt="Beach">

        <img src="https://picsum.photos/id/1074/600/400"
             alt="River">

        <img src="https://picsum.photos/id/1084/600/400"
             alt="Waterfall">

    </div>

</body>
</html>
