<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sliding Card Animation</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Card */
        .card {
            width: 320px;
            background-color: white;
            border-radius: 12px;
            overflow: hidden;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);

            animation: slideIn 1.5s ease-out;
        }

        /* Image */
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        /* Content */
        .content {
            padding: 25px;
            text-align: center;
        }

        .content h2 {
            color: #1d3557;
            margin-bottom: 10px;
        }

        .content p {
            color: #666;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            background-color: #e63946;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
        }

        .btn:hover {
            background-color: #c92f3c;
        }

        /* Sliding Animation */
        @keyframes slideIn {
            0% {
                transform: translateX(-500px);
                opacity: 0;
            }

            60% {
                transform: translateX(30px);
                opacity: 1;
            }

            100% {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <img src="https://picsum.photos/id/1015/600/400"
             alt="Beautiful Landscape">

        <div class="content">

            <h2>Explore Nature</h2>

            <p>
                Discover beautiful places and enjoy
                amazing natural landscapes.
            </p>

            <a href="#" class="btn">
                Learn More
            </a>

        </div>

    </div>

</body>
</html>
