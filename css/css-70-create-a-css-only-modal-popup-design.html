<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Only Modal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding: 80px 20px;
        }

        h1 {
            color: #1d3557;
            margin-bottom: 20px;
        }

        /* Open Button */
        .open-btn {
            display: inline-block;
            padding: 12px 25px;
            background-color: #457b9d;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .open-btn:hover {
            background-color: #1d3557;
        }

        /* Modal Background */
        .modal {
            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background-color: rgba(0, 0, 0, 0.7);

            display: flex;
            justify-content: center;
            align-items: center;

            /* Hidden by default */
            opacity: 0;
            visibility: hidden;

            transition: opacity 0.3s ease;
        }

        /* Show Modal */
        .modal:target {
            opacity: 1;
            visibility: visible;
        }

        /* Modal Box */
        .modal-content {
            width: 90%;
            max-width: 450px;

            background-color: white;
            padding: 30px;
            border-radius: 10px;

            position: relative;

            transform: scale(0.7);
            transition: transform 0.3s ease;
        }

        .modal:target .modal-content {
            transform: scale(1);
        }

        .modal-content h2 {
            color: #1d3557;
            margin-bottom: 15px;
        }

        .modal-content p {
            color: #555;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        /* Close Button */
        .close-btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #e63946;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .close-btn:hover {
            background-color: #c1121f;
        }

        /* X Button */
        .close-icon {
            position: absolute;
            top: 10px;
            right: 18px;

            font-size: 28px;
            color: #555;
            text-decoration: none;
        }

        .close-icon:hover {
            color: #e63946;
        }
    </style>
</head>

<body>

    <h1>CSS-Only Modal Popup</h1>

    <p>Click the button below to open the popup.</p>

    <br><br>

    <!-- Open Modal -->
    <a href="#modal" class="open-btn">
        Open Popup
    </a>


    <!-- Modal -->
    <div id="modal" class="modal">

        <div class="modal-content">

            <!-- Close X -->
            <a href="#" class="close-icon">&times;</a>

            <h2>Welcome!</h2>

            <p>
                This is a CSS-only modal popup.
                No JavaScript is required to open or
                close this popup.
            </p>

            <a href="#" class="close-btn">
                Close
            </a>

        </div>

    </div>

</body>
</html>
