```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Images and Hyperlinks</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            margin: 0;
        }

        header {
            background-color: #333;
            color: white;
            padding: 25px;
        }

        .container {
            width: 80%;
            margin: 30px auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
        }

        img {
            width: 300px;
            height: 200px;
            margin: 15px;
            border-radius: 10px;
        }

        a {
            color: blue;
            text-decoration: none;
            font-weight: bold;
            margin: 10px;
        }

        a:hover {
            text-decoration: underline;
        }

        footer {
            background-color: #333;
            color: white;
            padding: 15px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Images and Hyperlinks</h1>
        <p>HTML Practical</p>
    </header>

    <div class="container">

        <!-- Image -->
        <h2>Image</h2>

        <p>Example of an image in HTML:</p>

        <img src="https://picsum.photos/300/200"
             alt="Sample Image">


        <!-- Hyperlinks -->
        <h2>Hyperlinks</h2>

        <p>Click the links to visit the websites:</p>

        <a href="https://www.google.com" target="_blank">
            Google
        </a>

        <a href="https://www.wikipedia.org" target="_blank">
            Wikipedia
        </a>

        <a href="https://www.youtube.com" target="_blank">
            YouTube
        </a>


        <!-- Image Hyperlink -->
        <h2>Image as a Hyperlink</h2>

        <p>Click the image to open Google:</p>

        <a href="https://www.google.com" target="_blank">

            <img src="https://picsum.photos/301/200"
                 alt="Clickable Image">

        </a>

    </div>

    <footer>
        <p>HTML Images and Hyperlinks Experiment</p>
    </footer>

</body>

</html>
