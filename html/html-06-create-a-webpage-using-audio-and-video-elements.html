<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Audio and Video Elements</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f7fb;
            color: #172033;
        }

        header {
            background: #334155;
            color: white;
            padding: 25px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 10px;
        }

        main {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #00000015;
            text-align: center;
        }

        h2 {
            color: #334155;
        }

        audio {
            width: 80%;
            margin: 15px;
        }

        video {
            width: 80%;
            max-width: 600px;
            margin: 15px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #64748b;
        }
    </style>
</head>

<body>

    <header>
        <h1>Audio and Video Elements</h1>

        <nav>
            <a href="../index.html">Home</a>
            <a href="index.html">HTML Programs</a>
        </nav>
    </header>

    <main>

        <!-- Audio Section -->
        <section class="card">
            <h2>Audio Player</h2>

            <p>Listen to the audio below:</p>

            <audio controls>
                <source src="audio.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </section>

        <!-- Video Section -->
        <section class="card">
            <h2>Video Player</h2>

            <p>Watch the video below:</p>

            <video controls>
                <source src="video.mp4" type="video/mp4">
                Your browser does not support the video element.
            </video>
        </section>

    </main>

    <footer>
        Create a webpage using audio and video elements.
    </footer>

</body>

</html>
