```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Webpage Using Iframe</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f2f2f2;
        }

        header {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 25px;
        }

        nav {
            background-color: #555;
            text-align: center;
            padding: 12px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        .container {
            width: 80%;
            margin: 30px auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
        }

        iframe {
            width: 100%;
            height: 400px;
            border: 2px solid #333;
            border-radius: 8px;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Webpage Using Iframe</h1>
        <p>HTML Practical Experiment</p>
    </header>

    <nav>
        <a href="https://www.google.com" target="myframe">
            Google
        </a>

        <a href="https://www.wikipedia.org" target="myframe">
            Wikipedia
        </a>
    </nav>

    <div class="container">

        <h2>Iframe Demonstration</h2>

        <p>
            An iframe is used to display another webpage
            inside the current webpage.
        </p>

        <iframe
            name="myframe"
            src="https://www.wikipedia.org"
            title="Webpage displayed inside iframe">
        </iframe>

    </div>

    <footer>
        <p>HTML Frames and Iframe Experiment</p>
    </footer>

</body>

</html>
```
