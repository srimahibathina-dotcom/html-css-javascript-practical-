<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic HTML Page</title>
</head>
<body>

    <header>
        <h1>My Website</h1>
        <p>Welcome to my semantic HTML page</p>
    </header>

    <nav>
        <a href="#home">Home</a> |
        <a href="#about">About</a> |
        <a href="#contact">Contact</a>
    </nav>

    <main>
        <section id="home">
            <h2>Home</h2>

            <article>
                <h3>Article 1</h3>
                <p>This is the first article inside the section.</p>
            </article>

            <article>
                <h3>Article 2</h3>
                <p>This is the second article inside the section.</p>
            </article>
        </section>

        <section id="about">
            <h2>About Us</h2>
            <p>This section contains information about the website.</p>
        </section>
    </main>

    <footer id="contact">
        <p>&copy; 2026 My Website. All rights reserved.</p>
    </footer>

</body>
</html>
