<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Properties Demo</title>

    <style>
        /* Element Selector */
        body {
            background-color: #f2f2f2;
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        /* ID Selector */
        #heading {
            color: blue;
            text-align: center;
            font-size: 32px;
        }

        /* Class Selector */
        .description {
            color: green;
            font-family: Georgia, serif;
            font-size: 18px;
        }

        /* Box demonstrating margin, padding and border */
        .box {
            background-color: white;
            color: #333;
            border: 3px solid red;
            margin: 30px;
            padding: 20px;
            font-size: 20px;
            text-align: center;
        }

        /* Group Selector */
        h2, p {
            line-height: 1.5;
        }

        /* Universal Selector */
        * {
            box-sizing: border-box;
        }
    </style>
</head>

<body>

    <h1 id="heading">CSS Selectors and Properties</h1>

    <p class="description">
        This webpage demonstrates CSS selectors, colors, fonts, margins,
        padding, and borders.
    </p>

    <div class="box">
        <h2>CSS Box Model</h2>
        <p>
            This box uses a border, margin, padding, background color,
            and different font styles.
        </p>
    </div>

</body>
</html>
